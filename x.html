<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Show/Hide Password</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background: #f4f4f4;
        flex-direction: column;
      }
      .password-container {
        position: relative;
        display: flex;
        align-items: center;
        margin-bottom: 10px;
      }
      input {
        padding: 10px;
        font-size: 16px;
        width: 200px;
        border: 2px solid #ccc;
        border-radius: 4px;
        outline: none;
        transition: border 0.3s ease;
      }
      .eye-icon {
        width: 24px;
        height: 24px;
        cursor: pointer;
        position: absolute;
        right: 10px;
      }
      .slash {
        position: absolute;
        width: 22px;
        height: 2px;
        background: black;
        transform: translate(-50%, -50%) rotate(-45deg);
        top: 50%;
        left: 50%;
        opacity: 0;
        transition: opacity 0.3s ease, transform 0.3s ease, background 0.3s ease;
        transform-origin: center;
      }
      .hidden .slash {
        opacity: 1;
      }
      .error {
        border: 2px solid red !important;
      }
      .error-icon path {
        stroke: red !important;
      }
      .error-icon .slash {
        background: red !important;
      }
      button {
        padding: 10px 20px;
        font-size: 16px;
        background: #007bff;
        color: white;
        border: none;
        cursor: pointer;
        border-radius: 4px;
        transition: background 0.3s ease;
      }
      button:hover {
        background: #0056b3;
      }
      .eye-icon svg {
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div class="password-container">
      <input type="password" id="password1" placeholder="Enter password" />
      <div id="toggleEye1" class="eye-icon">
        <svg
          width="24"
          height="24"
          viewBox="0 0 17 17"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M16 8.33333C16 8.33333 13.2727 13 8.5 13C3.72727 13 1 8.33333 1 8.33333C1 8.33333 3.72727 4 8.5 4C13.2727 4 16 8.33333 16 8.33333Z"
            stroke="#2C2C2C"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path
            d="M8.5 11C9.88071 11 11 9.88071 11 8.5C11 7.11929 9.88071 6 8.5 6C7.11929 6 6 7.11929 6 8.5C6 9.88071 7.11929 11 8.5 11Z"
            stroke="#2C2C2C"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        <div class="slash"></div>
      </div>
    </div>
    <button id="submitBtn">Submit</button>

    <script>
      const passwordInput1 = document.getElementById("password1");
      const toggleEye1 = document.getElementById("toggleEye1");
      const submitBtn = document.getElementById("submitBtn");

      toggleEye1.addEventListener("click", () => {
        const isHidden = passwordInput1.type === "password";
        passwordInput1.type = isHidden ? "text" : "password";

        toggleEye1.classList.toggle("hidden", isHidden);
      });

      submitBtn.addEventListener("click", () => {
        if (passwordInput1.value.trim() === "") {
          passwordInput1.classList.add("error");
          toggleEye1.classList.add("error-icon");
        } else {
          passwordInput1.classList.remove("error");
          toggleEye1.classList.remove("error-icon");
        }
      });
    </script>
  </body>
</html>
