<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <link rel="stylesheet" href="../styles/css/global.css">
    </head>
    <body>
        <header>
            <div class="header_wrapper">
              <div class="container">
                <!-- logo -->
                <div class="logo">
                  <a href="../index.html"
                    ><img src="../assets/svg/logo.svg" alt="logo"
                  /></a>
                </div>
      
                <!-- navigation -->
                <div class="navigation">
                  <nav>
                    <ul>
                      <li><a href="#">ჩვენ შესახებ</a></li>
                      <li><a href="./authorization.html">ავტორიზაცია</a></li>
      
                      <!-- Toggle language button -->
                      <div class="toggle-language">
                        <input
                          type="checkbox"
                          id="toggle-button"
                          class="toggle-button"
                          checked
                        />
                        <label for="toggle-button" class="toggle-label">
                          <span class="toggle-label-on">GE</span>
                          <span class="toggle-label-off">EN</span>
                        </label>
                      </div>
                    </ul>
                  </nav>
                </div>
              </div>
            </div>
        </header>
        <main>
            <section class="container">
                <div class="hero-section" >
                    <div class="label-box">
                        <label>შეიყვანეთ ტექსი</label>
                        <span>7/250</span>
                    </div>
                    <form  class="form-container">
                        <textarea id="enterText" name="enterText">ჭკუა უხმარ არს ბრიყვთათვის, ჭკუა ცოდნით მოიხმარების
                        </textarea>    
                    </form>
                    <div class="btn-container">
                        <input class="clear-btn" type="reset"/>
                        <input type="submit" value="Submit">

                    </div>
                    
                </div>
            </section>

            <footer>
                <div class="footer-wrapper">
                  <div class="privacy">
                    <a href="#">კონფიდენციალურობის პოლიტიკა</a>
                    <a href="#">გამოყენების წესები</a>
                  </div>
                  <div class="logo-wrapper">
                    <a href="https://unilab.iliauni.edu.ge/">
                      <img
                        class="unilab"
                        src="../assets/svg/unilab-logo.svg"
                        alt="unilab logo"
                      />
                    </a>
                    <a href="https://iliauni.edu.ge/">
                      <img
                        class="iliauni"
                        src="../assets/svg/iliauni-logo.svg"
                        alt="iliauni logo"
                      />
                    </a>
                  </div>
                </div>
              </footer>
        </main>
    </body>
</html>
