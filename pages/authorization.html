<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../styles/css/global.css">
</head>
<body class="body">
    <div class="container" id="container">
        <a href="../index.html"><img src="../assets/svg/cancel.svg" class="cancel" id="blue-X"></a>
        <a href="../index.html"><img src="../assets/svg/cancel-white.svg" class="cancel-white" id="white-X"></a>
        <div class="form-container sign-in" id="sign-in">
            <form id="authorization-form" novalidate>
                <h2>ავტორიზაცია</h2>
                <label for="email-input" id="email-label">ელ.ფოსტა</label>
                <input type="email" id="email-input" name="email">
                <label for="password-input" id="password-label">პაროლი</label>
                <div class="password" id="password-input-id">
                    <input type="password" id="password-input" name="password">
                    <img src="../assets/svg/hide.svg" id="hide-password" class="password-icon">
                    <img src="../assets/svg/errorhide.svg" id="error-hide" class="password-error-icon">
                </div>
                <span class="forget" id="forget"><a href="#forget-password">დაგავიწყდათ პაროლი?</a></span>
                <button type="submit">ავტორიზაცია</button>
                <button class="google"><img src="../assets/svg/google-logo.svg">Sign in with Google</button>
            </form>
        </div>

        <section class="forget-password" id="forget-password" style="display: none;">
            <img src="../assets/authorization/back.png" alt="გადადით უკან" id="back" style="display: none;">
            <div class="form-container sign-in">
                <form id="forgetpassword-form" novalidate>
                    <h2>დაგავიწყდა პაროლი?</h2>
                    <label for="forget-password-email-label" id="forget-password-email-label">ელ.ფოსტა</label>
                    <input type="email" id="forget-password-email-input">
                    <button type="submit" id="check">პაროლის აღდგენა</button>
                </form>
            </div>
        </section>

        <section class="resolve-password" id="resolve-password" style="display: none;">
            <div class="form-container sign-in" id="resolve">
                <form id="resetpassword-form" novalidate>
                    <h2>პაროლის აღდგენა</h2>
                    <label for="resetform-password-input" id="resetform-password-label">ახალი პაროლი</label>
                    <div class="password">
                        <input type="password" id="resetform-password-input">
                        <img src="../assets/svg/hide.svg" id="resetform-password-hide-password" class="password-icon">
                        <img src="../assets/svg/errorhide.svg" id="resetfrom-password-error-hide" class="password-error-icon" style="display: none;">
                    </div>
                    <label for="reset-password-input" id="reset-password-label">გაიმეორეთ პაროლი</label>
                    <div class="password">
                        <input type="password" id="reset-password-input">
                        <img src="../assets/svg/hide.svg" id="reset-password-hide-password" class="password-icon">
                        <img src="../assets/svg/errorhide.svg" id="reset-password-error-hide" class="password-error-icon" style="display: none;">
                    </div>
                    <button type="submit" id="save">შენახვა</button>
                </form>
            </div>
        </section>

        <div class="form-container sign-up">
            <form id="register-form" novalidate>
                <h2>რეგისტრაცია</h2>
                <div class="person">
                    <div>
                        <label for="name-input" id="name-label">სახელი</label>
                        <input type="text" id="name-input" name="name">
                    </div>
                    <div>
                        <label for="surname-input" id="surname-label">გვარი</label>
                        <input type="text" id="surname-input" name="surname">
                    </div>
                </div>
                <label for="registration-email-input" id="registration-email-label">ელ.ფოსტა</label>
                <input type="email" id="registration-email-input" name="email">
                <label for="registration-password-input" id="registration-password-label">პაროლი</label>
                <div class="password">
                    <input type="password" id="registration-password-input" name="password">
                    <img src="../assets/svg/hide.svg" id="registrationForm-password-hide-password" class="password-icon">
                    <img src="../assets/svg/errorhide.svg" id="registrationForm-password-error-hide" class="password-error-icon" style="display: none;">
                </div>
                <label for="repeat-password-input" id="repeat-password-label">გაიმეორეთ პაროლი</label>
                <div class="password">
                    <input type="password" id="repeat-password-input">
                    <img src="../assets/svg/hide.svg" id="registration-password-hide-password" class="password-icon">
                    <img src="../assets/svg/errorhide.svg" id="registration-password-error-hide" class="password-error-icon" style="display: none;">
                </div>
                <div class="agreement">
                    <img src="../assets/svg/success.svg" style="display: none;" class="success-box box" id="success-box">
                    <img src="../assets/svg/box.svg" class="box" id="box">
                    <a href="#" class="agree" id="agree">ვეთანხმები საიტის გამოყენების წესებს და კონფიდენციალურობის პოლიტიკას.</a>
                </div>
                <button type="submit" class="register-btn" id="register-btn">რეგისტრაცია</button>
                <button class="google"><img src="../assets/svg/google-logo.svg">Sign in with Google</button>
            </form>
        </div>

        <div class="toggle-container">
            <div class="toggle">
                <div class="toggle-panel toggle-left">
                    <img src="../assets/svg/logo.svg">
                    <button class="toggle-btn" id="login">ავტორიზაცია</button>
                </div>
                <div class="toggle-panel toggle-right">
                    <img src="../assets/svg/logo.svg">
                    <button class="toggle-btn" id="authoritation" style="display: none;">ავტორიზაცია</button>
                    <button class="toggle-btn" id="register">რეგისტრაცია</button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="index.js"></script>
    <script src="../js/authorization.js"></script>
    <script src="../js/validation.js"></script>
</body>
</html>
