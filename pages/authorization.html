<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="../styles/css/global.css" />
  </head>
  <body class="body">
    <div class="container" id="container">
      <a href="../index.html"
        ><img src="../assets/svg/cancel.svg" class="cancel" id="blue-X"
      /></a>
      <a href="../index.html"
        ><img
          src="../assets/svg/cancel-white.svg"
          class="cancel-white"
          id="white-X"
      /></a>
      <div class="form-container sign-in" id="sign-in">
        <form id="authorization-form" novalidate>
          <h2>ავტორიზაცია</h2>
          <label for="email-input" id="email-label">ელ.ფოსტა</label>
          <input type="email" id="email-input" name="email" />
          <p class="error-message" id="email-error-message"></p>
          <label for="password-input" id="password-label">პაროლი</label>
          <!--  -->
          <div class="password password-container" id="password-input-id">
            <input type="password" id="password1" name="password" />
            <div id="toggleEye1" class="eye-icon">
              <svg
                width="17"
                height="17"
                viewBox="0 0 17 17"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="M16 8.33333C16 8.33333 13.2727 13 8.5 13C3.72727 13 1 8.33333 1 8.33333C1 8.33333 3.72727 4 8.5 4C13.2727 4 16 8.33333 16 8.33333Z"
                  stroke="#2C2C2C"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
                <path
                  d="M8.5 11C9.88071 11 11 9.88071 11 8.5C11 7.11929 9.88071 6 8.5 6C7.11929 6 6 7.11929 6 8.5C6 9.88071 7.11929 11 8.5 11Z"
                  stroke="#2C2C2C"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
              <div class="slash"></div>
            </div>

            <!-- <button id="submitBtn">Submit</button> -->
          </div>
          <p class="error-message" id="password-error-message"></p>
          <span class="forget" id="forget"
            ><a href="#forget-password">დაგავიწყდათ პაროლი?</a></span
          >
          <button type="submit" id="submitBtn">ავტორიზაცია</button>
          <button class="google">
            <img src="../assets/svg/google-logo.svg" />Sign in with Google
          </button>
        </form>
      </div>

      <section class="forget-password" id="forget-password">
        <a href="#sign-in"
          ><img src="../assets/svg/back.svg" alt="გადადით უკან" id="back"
        /></a>
        <div class="form-container sign-in">
          <form id="forgetpassword-form" novalidate>
            <h2>დაგავიწყდა პაროლი?</h2>
            <label
              for="forget-password-email-label"
              id="forget-password-email-label"
              >ელ.ფოსტა *</label
            >
            <input type="email" id="forget-password-email-input" />
            <p class="error-message" id="forget-password-error-message"></p>
            <button type="submit" id="check">პაროლის აღდგენა</button>
          </form>
        </div>
      </section>

      <section class="resolve-password" id="resolve-password">
        <div class="form-container sign-in" id="resolve">
          <form id="resetpassword-form" novalidate>
            <h2>პაროლის აღდგენა</h2>
            <label for="resetform-password-input" id="resetform-password-label"
              >ახალი პაროლი *</label
            >
            <div class="password">
              <input type="password" id="resetform-password-input" />
              <img
                src="../assets/svg/hide.svg"
                id="resetform-password-hide-password"
                class="password-icon"
              />
              <img
                src="../assets/svg/errorhide.svg"
                id="resetfrom-password-error-hide"
                class="password-error-icon"
              />
            </div>
            <p class="error-message" id="reset-resetPassword-error-message"></p>
            <label for="reset-password-input" id="reset-password-label"
              >გაიმეორეთ პაროლი *</label
            >
            <div class="password">
              <input type="password" id="reset-password-input" />
              <img
                src="../assets/svg/hide.svg"
                id="reset-password-hide-password"
                class="password-icon"
              />
              <img
                src="../assets/svg/errorhide.svg"
                id="reset-password-error-hide"
                class="password-error-icon"
              />
            </div>
            <p class="error-message" id="reset-password-error-message"></p>
            <button type="submit" id="save">შენახვა</button>
          </form>
        </div>
      </section>

      <div class="form-container sign-up">
        <form id="register-form" novalidate>
          <h2>რეგისტრაცია</h2>
          <!-- <p class="error-message" id="register-form-error-message"></p> -->
          <div class="person">
            <div>
              <label for="name-input" id="name-label">სახელი *</label>
              <input type="text" id="name-input" name="name" />
              <p
                class="error-message"
                id="register-form-name-error-message"
              ></p>
            </div>
            <div>
              <label for="surname-input" id="surname-label">გვარი *</label>
              <input type="text" id="surname-input" name="surname" />
              <p
                class="error-message"
                id="register-form-surname-error-message"
              ></p>
            </div>
          </div>
          <label for="registration-email-input" id="registration-email-label"
            >ელ.ფოსტა *</label
          >
          <input type="email" id="registration-email-input" name="email" />
          <p class="error-message" id="register-form-email-error-message"></p>
          <label
            for="registration-password-input"
            id="registration-password-label"
            >პაროლი *</label
          >
          <div class="password">
            <input
              type="password"
              id="registration-password-input"
              name="password"
            />
            <img
              src="../assets/svg/hide.svg"
              id="registrationForm-password-hide-password"
              class="password-icon"
            />
            <img
              src="../assets/svg/errorhide.svg"
              id="registrationForm-password-error-hide"
              class="password-error-icon"
            />
          </div>
          <p
            class="error-message"
            id="register-form-password-error-message"
          ></p>
          <label for="repeat-password-input" id="repeat-password-label"
            >გაიმეორეთ პაროლი *</label
          >
          <div class="password">
            <input type="password" id="repeat-password-input" />
            <img
              src="../assets/svg/hide.svg"
              id="registration-password-hide-password"
              class="password-icon"
            />
            <img
              src="../assets/svg/errorhide.svg"
              id="registration-password-error-hide"
              class="password-error-icon"
            />
          </div>
          <p
            class="error-message"
            id="register-form-reset-password-error-message"
          ></p>
          <div class="agreement">
            <img
              src="../assets/svg/success.svg"
              class="success-box box"
              id="success-box"
            />
            <img src="../assets/svg/box.svg" class="box" id="box" />
            <a href="#" class="agree" id="agree"
              >ვეთანხმები საიტის გამოყენების წესებს და კონფიდენციალურობის
              პოლიტიკას.</a
            >
          </div>
          <button type="submit" class="register-btn" id="register-btn">
            რეგისტრაცია
          </button>
          <button class="google">
            <img src="../assets/svg/google-logo.svg" />Sign in with Google
          </button>
        </form>
      </div>

      <div class="toggle-container">
        <div class="toggle">
          <div class="toggle-panel toggle-left">
            <img src="../assets/svg/logo.svg" />
            <button class="toggle-btn" id="login">ავტორიზაცია</button>
          </div>
          <div class="toggle-panel toggle-right">
            <img src="../assets/svg/logo.svg" />
            <button class="toggle-btn" id="authoritation">ავტორიზაცია</button>
            <button class="toggle-btn" id="register">რეგისტრაცია</button>
          </div>
        </div>
      </div>
    </div>

    <script src="../js/authorization.js"></script>
  </body>
</html>
